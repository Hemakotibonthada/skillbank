<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.2"/>
  <g filter="url(#shadow)">
    <!-- Faceted Skill Diamond -->
    <!-- Top Crown -->
    <polygon points="186,186 256,136 326,186 256,186" fill="url(#diamond)"/>
    <polygon points="186,186 146,236 216,236 256,186" fill="#C7D2FE"/>
    <polygon points="326,186 366,236 296,236 256,186" fill="#A5B4FC"/>
    <polygon points="216,236 296,236 256,186" fill="#E0E7FF"/>
    <!-- Bottom Pavilion -->
    <polygon points="146,236 256,366 216,236" fill="#818CF8"/>
    <polygon points="366,236 256,366 296,236" fill="#6366F1"/>
    <polygon points="216,236 256,366 296,236" fill="#4F46E5"/>
    <!-- Star Glint -->
    <circle cx="340" cy="166" r="16" fill="#FBBF24"/>
  </g>
</svg>