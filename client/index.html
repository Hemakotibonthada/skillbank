<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="SkillBank - Time-Based Skill Exchange Platform with AI Matching. Learn, teach, and grow together." />
    <meta name="theme-color" content="#7c4dff" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SkillBank" />
    <meta property="og:title" content="SkillBank - Skill Exchange Platform" />
    <meta property="og:description" content="Exchange skills with people worldwide. AI-powered matching, gamified learning, and a vibrant community." />
    <meta property="og:type" content="website" />
    <title>SkillBank - Time-Based Skill Exchange with AI Matching</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤝</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <!-- Initial loading screen -->
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#0a0a1a;color:#fff;font-family:system-ui">
        <div style="font-size:4rem;margin-bottom:16px;animation:pulse 2s infinite">🤝</div>
        <h1 style="font-size:1.5rem;font-weight:700;margin:0 0 8px">SkillBank</h1>
        <p style="color:#888;margin:0;font-size:0.875rem">Loading your experience...</p>
        <div style="width:120px;height:3px;background:#222;border-radius:4px;margin-top:24px;overflow:hidden">
          <div style="width:30%;height:100%;background:linear-gradient(90deg,#7c4dff,#e040fb);border-radius:4px;animation:loading 1.5s ease-in-out infinite"></div>
        </div>
      </div>
      <style>
        @keyframes loading { 0%{transform:translateX(-100%)} 50%{transform:translateX(200%)} 100%{transform:translateX(-100%)} }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
      </style>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
